---
# Rx server holds ONLY hardware setup.
# Every capture setting (sample rate, bandwidth, ref level, snippet timing) and all test
# info arrive from the Tx in the 'begin' message so you have to set those in tx_transmit_config.yaml.

rx:
  serial: 24248018 # BB60D serial number (0 = first BB60 found)
  bb-api-lib: null # path to bb_api.dll / libbb_api.so, or null to auto-find

server:
  host: '127.0.0.1' # 127.0.0.1 = localhost, 0.0.0.0 = allow other machines
  port: 5050

output:
  dir: 'results' # fallback only - the Tx sends the real results dir in 'begin'

mock: true # true = simulated BB60 (no hardware). override with --mock / --no-mock
debug-mode: false